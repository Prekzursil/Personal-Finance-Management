//noinspection GradleCompatible
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 37

    namespace "com.thriftyApp"

    defaultConfig {
        applicationId "com.preethi.thrifty"
        // 24 (Android 7.0): firebase-auth 25.0.0 declares minSdk 24.
        minSdk 24
        targetSdk 37
        versionCode = 1
        versionName = "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0' // Added Flexbox
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.firebase:firebase-auth:25.0.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    // ML Kit Text Recognition
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // CameraX core library using camera2 implementation
    def camerax_version = "1.6.1" // Or latest stable
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    // CameraX Lifecycle Library
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    // CameraX View class
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'com.github.bumptech.glide:glide:5.0.10'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.10'
    implementation 'com.itextpdf:itextg:5.5.10'
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.6.0'

    // Network and JSON handling
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.google.code.gson:gson:2.15.0'

    // Google Auth and Drive
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-analytics'

    // PDF Viewer
    implementation "com.github.mhiew:android-pdf-viewer:3.2.0-beta.1"

    // RecyclerView for lists
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
